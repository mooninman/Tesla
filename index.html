<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Fullscreen Hub</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1c1c1e;
      --card-hover: #2c2c2e;
      --accent-color: #e50914;
      --text-main: #ffffff;
      --text-sub: #a1a1a6;
      --border-color: #2c2c2e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1080px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .logo-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-title span {
      background: var(--accent-color);
      color: #fff;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .header-btns {
      display: flex;
      gap: 10px;
    }

    button {
      background: #2c2c2e;
      color: var(--text-main);
      border: 1px solid #3a3a3c;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:active {
      transform: scale(0.94);
      background: #3a3a3c;
    }

    .btn-fullscreen {
      background: var(--accent-color);
      border: none;
      font-weight: 600;
    }

    .btn-fullscreen:active {
      background: #b20710;
    }

    .notice-bar {
      background: #1c2533;
      border: 1px solid #2e3d52;
      color: #8ab4f8;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 18px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      aspect-ratio: 1 / 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      cursor: pointer;
      position: relative;
      transition: background 0.15s, transform 0.15s;
    }

    .card:active {
      background: var(--card-hover);
      transform: scale(0.92);
    }

    .card-icon-img {
      width: 52px;
      height: 52px;
      border-radius: 12px;
      object-fit: cover;
      margin-bottom: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      background-color: #2a2a2a;
    }

    .card-icon-text {
      font-size: 2.3rem;
      margin-bottom: 8px;
      line-height: 1;
    }

    .card-title {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text-sub);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .delete-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #ff3b30;
      color: white;
      border: none;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      font-size: 14px;
      font-weight: bold;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .editing .delete-btn {
      display: flex;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal {
      background: #1c1c1e;
      padding: 24px;
      border-radius: 20px;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid var(--border-color);
    }

    .modal h2 {
      font-size: 1.1rem;
    }

    .modal input {
      background: #0d0d0d;
      border: 1px solid #3a3a3c;
      color: #fff;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo-title">Tesla Hub <span>Theatre</span></div>
      <div class="header-btns">
        <button class="btn-fullscreen" id="fullscreenBtn">📺 全屏進入</button>
        <button id="addBtn">+ 新增</button>
        <button id="editBtn">編輯</button>
      </div>
    </header>

    <div class="notice-bar">
      <span>💡 點擊「<strong>全屏進入</strong>」透過 YouTube 劇院機制喚醒全屏，點擊頁面中的「Go to Site」即可全屏使用此 Hub。</span>
    </div>

    <div class="grid" id="shortcutGrid"></div>
  </div>

  <!-- 新增 Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>新增自訂捷徑</h2>
      <input type="text" id="inputName" placeholder="網站名稱">
      <input type="text" id="inputUrl" placeholder="網址 (https://...)">
      <input type="text" id="inputIcon" placeholder="圖示 URL (可選，留空自動擷取)">
      <div class="modal-actions">
        <button id="cancelBtn">取消</button>
        <button id="saveBtn" class="btn-fullscreen">儲存</button>
      </div>
    </div>
  </div>

  <script>
    // 指定 10 個網站的高畫質 Logo 圖片網址
    const defaultShortcuts = [
      { name: 'EMDY', url: 'https://emdy.mimdt.cc/', icon: 'https://emdy.mimdt.cc/favicon.ico' },
      { name: '觀影', url: 'https://www.xn--wcv59z.com/', icon: 'https://www.google.com/s2/favicons?domain=www.xn--wcv59z.com&sz=128' },
      { name: '低端影視', url: 'https://ddys.io/', icon: 'https://ddys.io/favicon-32x32.png' },
      { name: '4K 影視', url: 'https://www.4kvm.org/play/ch241ohlk', icon: 'https://www.4kvm.org/upload/site/20220613-1/7e155498877e8a9391d371421beed1eb.png' },
      { name: 'NetflixGC', url: 'https://www.netflixgc.com/', icon: 'https://www.google.com/s2/favicons?domain=netflixgc.com&sz=128' },
      { name: '西瓜動漫', url: 'https://www.xgcartoon.com/classify?type=%2a&region=jp&state=serial&filter=%2a', icon: 'https://www.google.com/s2/favicons?domain=www.xgcartoon.com&sz=128' },
      { name: 'AGE 動漫', url: 'https://www.agedm.io/', icon: 'https://www.agedm.io/favicon.ico' },
      { name: 'Anime1', url: 'https://anime1.me/', icon: 'https://anime1.me/apple-touch-icon.png' },
      { name: '動畫瘋', url: 'https://ani.gamer.com.tw/animeList.php', icon: 'https://i2.bahamut.com.tw/anime/anime_logo.png' },
      { name: 'Bilibili', url: 'https://www.bilibili.com/', icon: 'https://www.bilibili.com/favicon.ico' }
    ];

    let shortcuts = JSON.parse(localStorage.getItem('tesla_shortcuts_v6')) || defaultShortcuts;
    let isEditing = false;

    const grid = document.getElementById('shortcutGrid');
    const editBtn = document.getElementById('editBtn');
    const addBtn = document.getElementById('addBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const saveBtn = document.getElementById('saveBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    function getFaviconUrl(domainUrl) {
      try {
        const urlObj = new URL(domainUrl);
        return `https://www.google.com/s2/favicons?domain=${urlObj.hostname}&sz=128`;
      } catch (e) {
        return '';
      }
    }

    function getYouTubeRedirectUrl(targetUrl) {
      return 'https://www.youtube.com/redirect?q=' + encodeURIComponent(targetUrl);
    }

    function render() {
      grid.innerHTML = '';
      shortcuts.forEach((sc, index) => {
        const card = document.createElement('div');
        card.className = `card ${isEditing ? 'editing' : ''}`;

        // 優先渲染指定的 Logo 圖片網址，若失效則改為 Google Favicon 備用
        const img = document.createElement('img');
        img.className = 'card-icon-img';
        img.src = sc.icon || getFaviconUrl(sc.url);
        img.alt = sc.name;
        img.onerror = function() {
          if (this.src !== getFaviconUrl(sc.url)) {
            this.src = getFaviconUrl(sc.url);
          } else {
            const fallback = document.createElement('div');
            fallback.className = 'card-icon-text';
            fallback.textContent = '🌐';
            this.replaceWith(fallback);
          }
        };
        card.appendChild(img);

        const title = document.createElement('div');
        title.className = 'card-title';
        title.textContent = sc.name;
        card.appendChild(title);

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.textContent = '✕';
        delBtn.setAttribute('data-index', index);
        card.appendChild(delBtn);

        card.addEventListener('click', (e) => {
          if (isEditing) {
            if (e.target.classList.contains('delete-btn')) {
              shortcuts.splice(index, 1);
              saveShortcuts();
              render();
            }
            return;
          }
          window.location.href = getYouTubeRedirectUrl(sc.url);
        });

        grid.appendChild(card);
      });
    }

    function saveShortcuts() {
      localStorage.setItem('tesla_shortcuts_v6', JSON.stringify(shortcuts));
    }

    fullscreenBtn.addEventListener('click', () => {
      window.location.href = getYouTubeRedirectUrl(window.location.href);
    });

    editBtn.addEventListener('click', () => {
      isEditing = !isEditing;
      editBtn.textContent = isEditing ? '完成' : '編輯';
      render();
    });

    addBtn.addEventListener('click', () => {
      modalOverlay.style.display = 'flex';
    });

    cancelBtn.addEventListener('click', () => {
      modalOverlay.style.display = 'none';
    });

    saveBtn.addEventListener('click', () => {
      const name = document.getElementById('inputName').value.trim();
      let url = document.getElementById('inputUrl').value.trim();
      const icon = document.getElementById('inputIcon').value.trim();

      if (!name || !url) {
        alert('請填寫名稱與網址');
        return;
      }

      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }

      shortcuts.push({ name, url, icon });
      saveShortcuts();
      render();

      document.getElementById('inputName').value = '';
      document.getElementById('inputUrl').value = '';
      document.getElementById('inputIcon').value = '';
      modalOverlay.style.display = 'none';
    });

    render();
  </script>
</body>
</html>
