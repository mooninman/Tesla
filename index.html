<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tesla Fullscreen Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 16px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #f0f0f0;
        }

        .action-btn {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #3a3a3a;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        .action-btn:active {
            background-color: #444;
        }

        .shortcut-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 800px;
        }

        .shortcut-card {
            position: relative;
            background-color: #1e1e1e;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 18px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.15s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            user-select: none;
        }

        .shortcut-card:active {
            transform: scale(0.95);
            background-color: #2c2c2c;
        }

        .shortcut-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .shortcut-title {
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .delete-btn {
            display: none;
            position: absolute;
            top: -6px;
            right: -6px;
            background-color: #ff4d4f;
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            font-size: 14px;
            line-height: 20px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .editing .delete-btn {
            display: block;
        }

        .add-card {
            border: 2px dashed #3a3a3a;
            background-color: transparent;
        }

        /* Modal 對話框樣式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal {
            background-color: #1e1e1e;
            border: 1px solid #3a3a3a;
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 400px;
        }

        .modal h2 {
            font-size: 18px;
            margin-bottom: 16px;
        }

        .modal input {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            background-color: #121212;
            border: 1px solid #3a3a3a;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 8px;
        }

        video {
            position: absolute;
            top: 0; left: 0;
            width: 1px; height: 1px;
            opacity: 0.01;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Tesla 車載全屏入口</h1>
        <button class="action-btn" id="editToggleBtn" onclick="toggleEditMode()">編輯列表</button>
    </div>

    <div class="shortcut-grid" id="grid">
        <!-- 動態渲染卡片 -->
    </div>

    <!-- 新增網站 Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2>新增快捷網站</h2>
            <input type="text" id="siteName" placeholder="網站名稱 (例如: YouTube)">
            <input type="url" id="siteUrl" placeholder="網址 (https://...)">
            <input type="text" id="siteIcon" placeholder="Emoji 圖示 (預設: 🌐)" value="🌐">
            <div class="modal-actions">
                <button class="action-btn" onclick="closeModal()">取消</button>
                <button class="action-btn" style="background-color: #2196F3;" onclick="saveShortcut()">新增</button>
            </div>
        </div>
    </div>

    <video id="fullscreenTrigger" playsinline preload="auto">
        <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAAA=" type="video/mp4">
    </video>

    <script>
        // 更正後的預設網站清單
        const defaultShortcuts = [
            { name: 'EMDY', url: 'https://emdy.mimdt.cc/', icon: '🚀' },
            { name: '觀影', url: 'https://www.xn--wcv59z.com/', icon: '🎬' },
            { name: '低端影視', url: 'https://ddys.io/', icon: '💎' },
            { name: '4K 影視', url: 'https://www.4kvm.org/play/ch241ohlk', icon: '🎞️' },
            { name: 'NetflixGC', url: 'https://www.netflixgc.com/', icon: '🍿' },
            { name: '西瓜動漫', url: 'https://www.xgcartoon.com/classify?type=%2a&region=jp&state=serial&filter=%2a', icon: '🍉' },
            { name: 'AGE 動漫', url: 'https://www.agedm.io/', icon: '⚡' },
            { name: 'Anime1', url: 'https://anime1.me/', icon: '🍥' },
            { name: '動畫瘋', url: 'https://ani.gamer.com.tw/animeList.php', icon: '🎮' },
            { name: 'Bilibili', url: 'https://www.bilibili.com/', icon: '📺' }
        ];

        let shortcuts = [];
        let isEditing = false;
        let pendingUrl = '';

        const grid = document.getElementById('grid');
        const video = document.getElementById('fullscreenTrigger');

        function init() {
            const saved = localStorage.getItem('tesla_shortcuts');
            if (saved) {
                try {
                    shortcuts = JSON.parse(saved);
                } catch (e) {
                    shortcuts = [...defaultShortcuts];
                }
            } else {
                shortcuts = [...defaultShortcuts];
            }
            render();
        }

        function render() {
            grid.innerHTML = '';

            shortcuts.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = `shortcut-card ${isEditing ? 'editing' : ''}`;
                card.onclick = (e) => {
                    if (isEditing) return;
                    launchApp(item.url);
                };

                card.innerHTML = `
                    <div class="delete-btn" onclick="deleteShortcut(event, ${index})">✕</div>
                    <div class="shortcut-icon">${item.icon || '🌐'}</div>
                    <div class="shortcut-title">${item.name}</div>
                `;
                grid.appendChild(card);
            });

            const fsCard = document.createElement('div');
            fsCard.className = 'shortcut-card';
            fsCard.onclick = () => { if (!isEditing) launchApp(''); };
            fsCard.innerHTML = `
                <div class="shortcut-icon">⛶</div>
                <div class="shortcut-title">僅全屏當前頁</div>
            `;
            grid.appendChild(fsCard);

            const addCard = document.createElement('div');
            addCard.className = 'shortcut-card add-card';
            addCard.onclick = openModal;
            addCard.innerHTML = `
                <div class="shortcut-icon">＋</div>
                <div class="shortcut-title">新增捷徑</div>
            `;
            grid.appendChild(addCard);
        }

        function toggleEditMode() {
            isEditing = !isEditing;
            document.getElementById('editToggleBtn').innerText = isEditing ? '完成' : '編輯列表';
            render();
        }

        function openModal() {
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('siteName').value = '';
            document.getElementById('siteUrl').value = '';
            document.getElementById('siteIcon').value = '🌐';
        }

        function saveShortcut() {
            const name = document.getElementById('siteName').value.trim();
            let url = document.getElementById('siteUrl').value.trim();
            const icon = document.getElementById('siteIcon').value.trim() || '🌐';

            if (!name || !url) {
                alert('請輸入名稱與網址！');
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            shortcuts.push({ name, url, icon });
            saveToStorage();
            closeModal();
            render();
        }

        function deleteShortcut(e, index) {
            e.stopPropagation();
            shortcuts.splice(index, 1);
            saveToStorage();
            render();
        }

        function saveToStorage() {
            localStorage.setItem('tesla_shortcuts', JSON.stringify(shortcuts));
        }

        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onFullscreenChange);

        function onFullscreenChange() {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            if (isFullscreen && pendingUrl) {
                const target = pendingUrl;
                pendingUrl = '';
                window.location.replace(target);
            }
        }

        function launchApp(targetUrl) {
            pendingUrl = targetUrl;

            if (video.requestFullscreen) {
                video.requestFullscreen().catch(handleError);
            } else if (video.webkitRequestFullscreen) {
                video.webkitRequestFullscreen();
            }

            video.play().catch(handleError);

            if (targetUrl) {
                setTimeout(() => {
                    if (pendingUrl) {
                        window.location.href = pendingUrl;
                    }
                }, 800);
            }
        }

        function handleError(err) {
            if (pendingUrl) {
                window.location.href = pendingUrl;
            }
        }

        init();
    </script>
</body>
</html>
