<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Fullscreen Hub</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --card-hover: #2d2d2d;
      --accent-color: #e50914;
      --text-main: #ffffff;
      --text-sub: #aaaaaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
    }

    .header-btns {
      display: flex;
      gap: 8px;
    }

    button {
      background: #2a2a2a;
      color: var(--text-main);
      border: 1px solid #444;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.96);
      background: #3a3a3a;
    }

    .btn-fullscreen {
      background: #e50914;
      border: none;
      font-weight: bold;
    }

    .btn-fullscreen:active {
      background: #b20710;
    }

    .notice {
      background: #1a2634;
      border: 1px solid #2b4c7e;
      color: #90caf9;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 16px;
      flex: 1;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
      border: 1px solid #2a2a2a;
    }

    .card:active {
      background: var(--card-hover);
      transform: scale(0.95);
    }

    .card-icon {
      font-size: 2.2rem;
    }

    .card-title {
      font-size: 0.85rem;
      color: var(--text-sub);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .delete-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #ff4444;
      color: white;
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-size: 14px;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .editing .delete-btn {
      display: flex;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal {
      background: #222;
      padding: 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid #444;
    }

    .modal h2 {
      font-size: 1.2rem;
    }

    .modal input {
      background: #111;
      border: 1px solid #444;
      color: #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 1rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Tesla Hub</h1>
    <div class="header-btns">
      <button class="btn-fullscreen" id="fullscreenBtn">📺 全屏模式</button>
      <button id="addBtn">+ 新增</button>
      <button id="editBtn">編輯</button>
    </div>
  </header>

  <div class="notice">
    💡 <strong>Tesla 車機全屏操作說明：</strong><br>
    首次開啟時點擊右上角「<strong>全屏模式</strong>」，車機會喚醒劇院模式跳轉至 YouTube，點擊頁面中的「<strong>Go to Site (前往網站)</strong>」即可在全屏狀態下使用此 Hub。
  </div>

  <div class="grid" id="shortcutGrid"></div>

  <!-- 新增捷徑 Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>新增捷徑</h2>
      <input type="text" id="inputName" placeholder="名稱 (例如: YouTube)">
      <input type="text" id="inputUrl" placeholder="網址 (https://...)">
      <input type="text" id="inputIcon" placeholder="圖示 Emoji (例如: 🎬)">
      <div class="modal-actions">
        <button id="cancelBtn">取消</button>
        <button id="saveBtn" style="background:#e50914; border:none;">儲存</button>
      </div>
    </div>
  </div>

  <script>
    const defaultShortcuts = [
      { name: "YouTube", url: "https://www.youtube.com", icon: "🔴" },
      { name: "Bilibili", url: "https://www.bilibili.com", icon: "📺" },
      { name: "Netflix", url: "https://www.netflix.com", icon: "🍿" },
      { name: "Anime1", url: "https://anime1.me", icon: "🌸" },
      { name: "動畫瘋", url: "https://ani.gamer.com.tw", icon: "🎮" },
      { name: "Disney+", url: "https://www.disneyplus.com", icon: "🏰" }
    ];

    let shortcuts = JSON.parse(localStorage.getItem('tesla_shortcuts')) || defaultShortcuts;
    let isEditing = false;

    const grid = document.getElementById('shortcutGrid');
    const editBtn = document.getElementById('editBtn');
    const addBtn = document.getElementById('addBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const saveBtn = document.getElementById('saveBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    // 構建 YouTube 重定向網址 (Tesla 劇院模式觸發核心)
    function getYouTubeRedirectUrl(targetUrl) {
      return 'https://www.youtube.com/redirect?q=' + encodeURIComponent(targetUrl);
    }

    function render() {
      grid.innerHTML = '';
      shortcuts.forEach((sc, index) => {
        const card = document.createElement('div');
        card.className = `card ${isEditing ? 'editing' : ''}`;
        card.innerHTML = `
          <div class="card-icon">${sc.icon || '🌐'}</div>
          <div class="card-title">${sc.name}</div>
          <button class="delete-btn" data-index="${index}">✕</button>
        `;

        card.addEventListener('click', (e) => {
          if (isEditing) {
            if (e.target.classList.contains('delete-btn')) {
              shortcuts.splice(index, 1);
              saveShortcuts();
              render();
            }
            return;
          }
          // 透過 YouTube 重定向進入全屏跳轉
          window.location.href = getYouTubeRedirectUrl(sc.url);
        });

        grid.appendChild(card);
      });
    }

    function saveShortcuts() {
      localStorage.setItem('tesla_shortcuts', JSON.stringify(shortcuts));
    }

    // 將本頁面經由 YouTube 重定向重新載入，實現全屏 Hub
    fullscreenBtn.addEventListener('click', () => {
      const currentUrl = window.location.href;
      window.location.href = getYouTubeRedirectUrl(currentUrl);
    });

    editBtn.addEventListener('click', () => {
      isEditing = !isEditing;
      editBtn.textContent = isEditing ? '完成' : '編輯';
      render();
    });

    addBtn.addEventListener('click', () => {
      modalOverlay.style.display = 'flex';
    });

    cancelBtn.addEventListener('click', () => {
      modalOverlay.style.display = 'none';
    });

    saveBtn.addEventListener('click', () => {
      const name = document.getElementById('inputName').value.trim();
      let url = document.getElementById('inputUrl').value.trim();
      const icon = document.getElementById('inputIcon').value.trim();

      if (!name || !url) {
        alert('請填寫名稱與網址');
        return;
      }

      if (!/^https?:\/\//i.test(url)) {
        url = 'https://' + url;
      }

      shortcuts.push({ name, url, icon });
      saveShortcuts();
      render();

      document.getElementById('inputName').value = '';
      document.getElementById('inputUrl').value = '';
      document.getElementById('inputIcon').value = '';
      modalOverlay.style.display = 'none';
    });

    render();
  </script>
</body>
</html>
